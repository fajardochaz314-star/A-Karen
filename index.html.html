  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;700&family=Noto+Sans+JP&family=Noto+Sans+KR&family=Noto+Sans+SC&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body, #root {
    background: #0a0010;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Noto Sans', sans-serif;
    overflow: hidden;
  }

  #root {
    position: relative;
    width: 100%;
    min-height: 520px;
  }

  canvas#stars {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 0;
  }

  .center-container {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    padding: 32px 16px;
    width: 100%;
  }

  .heart-icon {
    font-size: 54px;
    animation: heartbeat 1.4s ease-in-out infinite;
    filter: drop-shadow(0 0 18px #ff4da6cc);
    line-height: 1;
  }

  @keyframes heartbeat {
    0%, 100% { transform: scale(1); }
    15% { transform: scale(1.18); }
    30% { transform: scale(1); }
    45% { transform: scale(1.1); }
    60% { transform: scale(1); }
  }

  .word-display {
    text-align: center;
    min-height: 110px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .lang-label {
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #ff80c8;
    opacity: 0;
    animation: fadeLabel 0.5s ease 0.1s forwards;
  }

  .love-word {
    font-size: clamp(28px, 7vw, 52px);
    font-weight: 700;
    color: #fff;
    text-shadow: 0 0 24px #ff4da6aa, 0 0 60px #c026d344;
    opacity: 0;
    transform: scale(0.7) translateY(12px);
    animation: popIn 0.5s cubic-bezier(0.34,1.56,0.64,1) forwards;
    letter-spacing: 1px;
  }

  @keyframes popIn {
    to { opacity: 1; transform: scale(1) translateY(0); }
  }
  @keyframes fadeLabel {
    to { opacity: 0.75; }
  }

  .counter {
    font-size: 12px;
    color: #ffffff55;
    letter-spacing: 1px;
    margin-top: 4px;
  }

  .progress-bar-wrap {
    width: min(320px, 85vw);
    height: 3px;
    background: #ffffff15;
    border-radius: 2px;
    overflow: hidden;
  }

  .progress-bar-fill {
    height: 100%;
    border-radius: 2px;
    background: linear-gradient(90deg, #ff4da6, #c026d3);
    transition: width 0.1s linear;
  }

  .controls {
    display: flex;
    gap: 12px;
    align-items: center;
    margin-top: 4px;
  }

  .ctrl-btn {
    background: #ffffff12;
    border: 1px solid #ffffff22;
    color: #fff;
    border-radius: 50px;
    padding: 8px 22px;
    font-size: 13px;
    cursor: pointer;
    transition: background 0.2s, transform 0.15s;
    letter-spacing: 0.5px;
  }
  .ctrl-btn:hover { background: #ff4da620; transform: scale(1.04); }
  .ctrl-btn.active { background: #ff4da640; border-color: #ff4da6; }

  .floating-hearts {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 1;
    overflow: hidden;
  }

  .fh {
    position: absolute;
    bottom: -40px;
    font-size: 20px;
    opacity: 0;
    animation: floatUp var(--dur) ease-in forwards;
    animation-delay: var(--delay);
  }

  @keyframes floatUp {
    0%   { opacity: 0; transform: translateY(0) scale(0.5); }
    15%  { opacity: 0.8; }
    85%  { opacity: 0.5; }
    100% { opacity: 0; transform: translateY(-480px) scale(1.2) rotate(var(--rot)); }
  }
</style>

    <div class="controls">

      <button class="ctrl-btn active" id="playBtn">⏸ Pausa</button>

</div>

];

let current = 0;
let playing = true;
let interval = null;
const INTERVAL_MS = 2200;

const langLabel = document.getElementById('langLabel');
const loveWord = document.getElementById('loveWord');
const counter = document.getElementById('counter');
const progressFill = document.getElementById('progressFill');
const playBtn = document.getElementById('playBtn');
const fhearts = document.getElementById('fhearts');

function showEntry(i) {
  langLabel.style.animation = 'none';
  loveWord.style.animation = 'none';
  void langLabel.offsetWidth;
  void loveWord.offsetWidth;
  langLabel.textContent = data[i][0];
  loveWord.textContent = data[i][1];
  langLabel.style.animation = 'fadeLabel 0.5s ease 0.1s forwards';
  loveWord.style.animation = 'popIn 0.5s cubic-bezier(0.34,1.56,0.64,1) forwards';
  counter.textContent = `${i+1} / ${data.length}`;
  progressFill.style.width = `${((i+1)/data.length)*100}%`;
  if (i % 5 === 0) spawnHearts();
}

function spawnHearts() {
  const emojis = ['💗','💖','💕','💓','💝','❤️','🩷'];
  for (let k = 0; k < 5; k++) {
    const el = document.createElement('div');
    el.className = 'fh';
    el.textContent = emojis[Math.floor(Math.random()*emojis.length)];
    el.style.setProperty('--dur', (2.5 + Math.random()*2) + 's');
    el.style.setProperty('--delay', (k * 0.18) + 's');
    el.style.setProperty('--rot', (Math.random()*60-30) + 'deg');
    el.style.left = (8 + Math.random() * 84) + '%';
    fhearts.appendChild(el);
    setTimeout(() => el.remove(), 5000);
  }
}

function next() {
  current = (current + 1) % data.length;
  showEntry(current);
}

function prev() {
  current = (current - 1 + data.length) % data.length;
  showEntry(current);
}

function startInterval() {
  clearInterval(interval);
  interval = setInterval(next, INTERVAL_MS);
}

function togglePlay() {
  playing = !playing;
  if (playing) {
    playBtn.textContent = '⏸ Pausa';
    playBtn.classList.add('active');
    startInterval();
  } else {
    playBtn.textContent = '▶ Play';
    playBtn.classList.remove('active');
    clearInterval(interval);
  }
}

document.getElementById('prevBtn').onclick = () => { prev(); if(playing) startInterval(); };
document.getElementById('nextBtn').onclick = () => { next(); if(playing) startInterval(); };
playBtn.onclick = togglePlay;

const canvas = document.getElementById('stars');
const ctx = canvas.getContext('2d');
let stars = [];

function resizeCanvas() {
  const parent = canvas.parentElement;
  canvas.width = parent.offsetWidth;
  canvas.height = parent.offsetHeight || 520;
  stars = Array.from({length: 120}, () => ({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    r: Math.random() * 1.4 + 0.3,
    a: Math.random(),
    speed: 0.003 + Math.random()*0.008
  }));
}

function drawStars() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  stars.forEach(s => {
    s.a += s.speed;
    const alpha = 0.3 + 0.5 * Math.abs(Math.sin(s.a));
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
    ctx.fillStyle = `rgba(255,180,230,${alpha})`;
    ctx.fill();
  });
  requestAnimationFrame(drawStars);
}

resizeCanvas();
drawStars();
showEntry(0);
startInterval();
spawnHearts();
</script>
